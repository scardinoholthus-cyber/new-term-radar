name: New-term radar

# Runs once a day at 09:30 Asia/Shanghai (01:30 UTC).
# The runtime config is generated from config.example.json so no extra config file
# needs to be maintained in this fork.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    if: vars.RADAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned radar release
        run: pip install uv

      - name: Build low-cost runtime config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("config.example.json").read_text(encoding="utf-8"))
          config["markets"]["enabled"] = False
          config["ai_answers"]["enabled"] = False
          config["usecases"]["per_day"] = 3
          config["review"]["per_day"] = 3
          Path("config.json").write_text(
              json.dumps(config, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Restore radar state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - name: Run daily radar
        env:
          AISA_API_KEY: ${{ secrets.AISA_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uvx new-term-radar==0.7.1 daily --out report.md
          if [ -f report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Save radar state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}

      - name: Keep report and state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-daily-${{ github.run_id }}
          path: |
            report.md
            report.json
            state/radar.db
          if-no-files-found: ignore
          retention-days: 30
