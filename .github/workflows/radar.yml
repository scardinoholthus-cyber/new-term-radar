name: New-term radar · free listening

# Daily public-source scan. No paid API keys are read by this workflow.
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/radar.yml"

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  radar:
    if: vars.RADAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Build free-listening config
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("config.example.json").read_text(encoding="utf-8"))
          config["judge"]["model"] = ""
          config["markets"]["enabled"] = False
          config["ai_answers"]["enabled"] = False
          config["usecases"]["per_day"] = 0
          config["review"]["per_day"] = 0
          config.setdefault("tutorials", {})["max_leads"] = 0
          config["feeds"] = {"enabled": [
              "producthunt",
              "hn",
              "openrouter",
              "appstore",
              "awesome",
          ], "weekly": []}
          Path("config.free.json").write_text(
              json.dumps(config, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Restore radar state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}
          restore-keys: radar-state-

      - name: Run free public-source scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uvx new-term-radar==0.7.1 daily \
            --config config.free.json \
            --skip x,judge,newsites,revenue,asks,sellers,builders,gsc,review,usecases,tutorials,money,sidelights \
            --out report.md
          if [ -f report.md ]; then cat report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Verify no paid API spend
        run: |
          if grep -Eq 'Paid API data spend this run.*\$0\.000' report.md; then
            echo "Verified: paid API spend is $0.000"
          else
            echo "Could not verify a zero-spend line in report.md"
            exit 1
          fi

      - name: Save radar state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: radar-state-${{ github.run_id }}

      - name: Keep free-listening report and state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-free-${{ github.run_id }}
          path: |
            report.md
            report.json
            state/radar.db
          if-no-files-found: ignore
          retention-days: 30
